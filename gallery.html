
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Oldepe Tours & Safaris</title>
  <meta name="description" content="Photograph gallery of Oldepe Tours & Safaris experiences in Kenya.">

  <style>
    :root {
      --sand: #F4EBE1;
      --charcoal: #2E2A25;
      --orange: #D97736;
      --white: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--sand);
      color: var(--charcoal);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    a {
      text-decoration: none;
    }

    header {
      background: var(--charcoal);
      padding: 20px 5%;
      border-bottom: 3px solid var(--orange);
    }

    .nav {
      max-width: 1250px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .logo {
      color: var(--sand);
      font-size: 21px;
      font-weight: bold;
      line-height: 1.2;
    }

    .logo span {
      display: block;
      color: var(--orange);
      font-size: 10px;
      letter-spacing: 3px;
      margin-top: 5px;
    }

    nav {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    nav a {
      color: var(--sand);
      font-size: 14px;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav a:hover,
    nav a.active {
      color: var(--orange);
    }

    .whatsapp {
      background: var(--orange);
      color: var(--white);
      padding: 10px 15px;
      border-radius: 4px;
    }

    .whatsapp:hover {
      background: var(--sand);
      color: var(--charcoal);
    }

    main {
      background: var(--sand);
      padding: 35px 5% 65px;
    }

    .gallery {
      max-width: 1250px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .photo {
      height: 300px;
      overflow: hidden;
      border-radius: 5px;
      background: var(--charcoal);
    }

    .photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.45s ease;
    }

    .photo:hover img {
      transform: scale(1.05);
    }

    footer {
      background: var(--charcoal);
      color: var(--sand);
      text-align: center;
      padding: 25px 5%;
      border-top: 3px solid var(--orange);
    }

    footer p {
      margin: 5px 0;
      font-size: 14px;
    }

    footer a {
      color: var(--orange);
    }

    @media (max-width: 850px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }

      .photo {
        height: 260px;
      }
    }

    @media (max-width: 600px) {
      .nav {
        flex-direction: column;
        text-align: center;
      }

      nav {
        justify-content: center;
        gap: 13px;
      }

      main {
        padding: 20px 4% 40px;
      }

      .gallery {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .photo {
        height: 280px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="nav">

      <a href="index.html" class="logo">
        OLDEPE TOURS & SAFARIS
        <span>TEMBEA KENYA</span>
      </a>

      <nav>
        <a href="index.html">Home</a>
        <a href="safaris.html">Safaris</a>
        <a href="tours.html">Tours</a>
        <a href="about.html">About</a>
        <a href="gallery.html" class="active">Gallery</a>
        <a href="contact.html">Contact</a>
        <a
          class="whatsapp"
          href="https://wa.me/254720580063">
          WhatsApp
        </a>
      </nav>

    </div>
  </header>

  <main>
    <div class="gallery">

      <div class="photo">
        <img src="images/safari1.jpg" alt="Safari photograph 1">
      </div>

      <div class="photo">
        <img src="images/safari2.jpg" alt="Safari photograph 2">
      </div>

      <div class="photo">
        <img src="images/safari4.jpg" alt="Safari photograph 4">
      </div>

      <div class="photo">
        <img src="images/safari5.jpg" alt="Safari photograph 5">
      </div>

      <div class="photo">
        <img src="images/safari6.jpg" alt="Safari photograph 6">
      </div>

      <div class="photo">
        <img src="images/safari7.jpg" alt="Safari photograph 7">
      </div>

      <div class="photo">
        <img src="images/safari8.jpg" alt="Safari photograph 8">
      </div>

      <div class="photo">
        <img src="images/safari9.jpg" alt="Safari photograph 9">
      </div>

    </div>
  </main>

  <footer>
    <p><strong>OLDEPE TOURS & SAFARIS</strong></p>
    <p>Discover Kenya. Experience the wild.</p>
    <p>Phone: <a href="tel:+254720580063">0720 580 063</a></p>
    <p>© 2026 Oldepe Tours & Safaris. All Rights Reserved.</p>
  </footer>

</body>
</html>
